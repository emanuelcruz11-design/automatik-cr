<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR por mesa · {{ restaurant.name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/restaurant_v4.css') }}"></head>
<body class="ops-body qr-hub-body">
<header class="ops-header"><div><span class="ops-kicker">QR POR MESA · DEMO</span><h1>{{ restaurant.name }}</h1></div><div class="ops-actions"><a href="{{ url_for('restaurant_demo') }}">Centro de demo</a><a href="{{ url_for('restaurant_kitchen') }}">Cocina</a><a href="{{ url_for('restaurant_admin') }}">Administración</a></div></header>
<main class="ops-main"><div class="ops-title"><div><h2>Escaneá una mesa</h2><span>En móvil, tocá “Probar mesa”. En computadora, escaneá el QR.</span></div></div>
<div class="qr-grid">{% for mesa in mesas %}<article class="qr-table-card"><small>MESA</small><h3>{{ mesa }}</h3><img src="{{ url_for('restaurant_qr', mesa=mesa) }}" alt="QR mesa {{ mesa }}"><a href="{{ url_for('restaurant_menu', mesa=mesa) }}">Probar mesa {{ mesa }}</a></article>{% endfor %}</div></main>
</body></html>
